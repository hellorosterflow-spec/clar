name: Enable GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml
  workflow_dispatch:

# The cloud agent token cannot create a Pages site (needs pages:write).
# GITHUB_TOKEN in this workflow can, and it publishes main / as the source.
permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from the default branch root
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              const existing = await github.rest.repos.getPages({ owner, repo });
              core.info(
                `already-enabled html_url=${existing.data.html_url} status=${existing.data.status} build_type=${existing.data.build_type} source=${JSON.stringify(existing.data.source)}`
              );
              return;
            } catch (error) {
              if (error.status !== 404) {
                core.setFailed(`getPages failed: ${error.status} ${error.message}`);
                return;
              }
            }
            try {
              const created = await github.rest.repos.createPagesSite({
                owner,
                repo,
                build_type: "legacy",
                source: { branch: "main", path: "/" },
              });
              core.info(
                `created html_url=${created.data.html_url} status=${created.data.status} build_type=${created.data.build_type} source=${JSON.stringify(created.data.source)}`
              );
            } catch (error) {
              const data =
                error.response && error.response.data
                  ? JSON.stringify(error.response.data)
                  : "";
              core.setFailed(
                `createPagesSite failed: ${error.status} ${error.message} ${data}`
              );
            }
